<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Country Explorer</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <link
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="text-center p-4">
    <h1>Country Explorer</h1>
    <p>Search for a country to discover its details and location.</p>
  </header>

  <main class="container py-4">
    <form id="search-form" class="mb-4">
      <label for="country-input" class="form-label">
        Country name
      </label>

      <div class="d-flex gap-2">
        <input type="text" id="country-input"
               class="form-control"
               placeholder="For example, Australia">

        <button type="submit" id="search-button"
                class="btn btn-primary">
          Search
        </button>
      </div>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <div class="results-layout">
      <section id="country-details"
               class="card p-4"
               aria-label="Country details" hidden>
      </section>

      <section id="map-panel" aria-label="Country map" hidden>
        <h2 class="h4">Location</h2>
        <div id="map"></div>
      </section>
    </div>
  </main>

  <footer class="text-center p-3">
    <p>
      Country data:
      <a href="https://countries.dev">countries.dev</a>
    </p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
